<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account • QRABES</title>


<script src="https://cdn.tailwindcss.com"></script>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<style>

body{
font-family:Inter,Arial,sans-serif;
}

</style>


</head>


<body class="bg-black text-white min-h-screen overflow-hidden">


<!-- Background -->

<div class="fixed inset-0 bg-gradient-to-br from-black via-neutral-900 to-black"></div>


<div class="fixed inset-0 bg-black/50 backdrop-blur-sm"></div>



<!-- Container -->

<div class="relative min-h-screen flex items-center justify-center px-5">


<div class="w-full max-w-md 
bg-white/5 
border border-white/10 
backdrop-blur-xl
rounded-3xl
p-8
shadow-2xl">



<!-- Logo -->

<div class="text-center mb-8">


<h1 class="text-4xl font-bold tracking-widest text-white">
QRABES
</h1>


<p class="text-gray-400 mt-2 text-sm">
Luxury Magazine • Social Platform
</p>


</div>




<form id="signupForm" class="space-y-5">



<!-- Full Name -->

<div>

<label class="text-sm text-gray-300">
Full Name
</label>


<input
id="fullName"
type="text"
placeholder="Enter your name"
class="
mt-2 w-full
bg-black/40
border border-white/10
rounded-xl
px-4 py-3
outline-none
focus:border-yellow-500
transition
">


</div>





<!-- Username -->

<div>

<label class="text-sm text-gray-300">
Username
</label>


<input
id="username"
type="text"
placeholder="Create username"
class="
mt-2 w-full
bg-black/40
border border-white/10
rounded-xl
px-4 py-3
outline-none
focus:border-yellow-500
transition
">


</div>






<!-- Email -->

<div>

<label class="text-sm text-gray-300">
Email Address
</label>


<input
id="email"
type="email"
placeholder="Enter your email"
class="
mt-2 w-full
bg-black/40
border border-white/10
rounded-xl
px-4 py-3
outline-none
focus:border-yellow-500
transition
">


</div>







<!-- Password -->

<div>

<label class="text-sm text-gray-300">
Password
</label>


<input
id="password"
type="password"
placeholder="Create password"
class="
mt-2 w-full
bg-black/40
border border-white/10
rounded-xl
px-4 py-3
outline-none
focus:border-yellow-500
transition
">


</div>







<!-- Confirm Password -->

<div>

<label class="text-sm text-gray-300">
Confirm Password
</label>


<input
id="confirmPassword"
type="password"
placeholder="Confirm password"
class="
mt-2 w-full
bg-black/40
border border-white/10
rounded-xl
px-4 py-3
outline-none
focus:border-yellow-500
transition
">


</div>






<button
type="submit"
class="
w-full
py-3
rounded-xl
bg-yellow-500
text-black
font-semibold
hover:bg-yellow-400
transition
">

Create Account

</button>






<div class="flex items-center gap-3 my-5">

<div class="h-px bg-white/10 flex-1"></div>

<span class="text-gray-500 text-sm">
OR
</span>

<div class="h-px bg-white/10 flex-1"></div>

</div>






<p class="text-center text-gray-400 text-sm">

Already have an account?

<a href="login.html"
class="text-yellow-500 hover:underline">

Login

</a>


</p>



</form>


</div>


</div>



<script src="signup.js"></script>


</body>

  </html>

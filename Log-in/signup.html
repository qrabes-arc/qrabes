<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account • QRABES</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="bg"></div>

<div class="overlay"></div>

<div class="container">

<div class="login-card">

<div class="logo-box">

<h1>QRABES</h1>

<p>
Luxury Magazine • Social Platform
</p>

</div>

<form id="signupForm">


<!-- =========================================================
     USERNAME
========================================================= -->

<div class="input-group">

<label>Username</label>

<div class="input-box">

<svg xmlns="http://www.w3.org/2000/svg"
width="20"
height="20"
fill="none"
stroke="currentColor"
stroke-width="2"
viewBox="0 0 24 24">

<circle
cx="12"
cy="8"
r="4"/>

<path
d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>

</svg>

<input
id="username"
type="text"
placeholder="Create your username"
required>

</div>

</div>


<!-- =========================================================
     EMAIL
========================================================= -->

<div class="input-group">

<label>Email Address</label>

<div class="input-box">

<svg xmlns="http://www.w3.org/2000/svg"
width="20"
height="20"
fill="none"
stroke="currentColor"
stroke-width="2"
viewBox="0 0 24 24">

<path d="M4 4h16v16H4z"/>

<path d="m4 7 8 6 8-6"/>

</svg>

<input
id="email"
type="email"
placeholder="Enter your email"
required>

</div>

</div>


<!-- =========================================================
     PASSWORD
========================================================= -->

<div class="input-group">

<label>Password</label>

<div class="input-box">

<svg xmlns="http://www.w3.org/2000/svg"
width="20"
height="20"
fill="none"
stroke="currentColor"
stroke-width="2"
viewBox="0 0 24 24">

<rect
x="3"
y="11"
width="18"
height="10"
rx="2"/>

<path d="M7 11V7a5 5 0 0 1 10 0v4"/>

</svg>

<input
id="password"
type="password"
placeholder="Create your password"
required>

<button
type="button"
id="togglePassword"
class="eye-btn">

<svg xmlns="http://www.w3.org/2000/svg"
width="20"
height="20"
fill="none"
stroke="currentColor"
stroke-width="2"
viewBox="0 0 24 24">

<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12"/>

<circle
cx="12"
cy="12"
r="3"/>

</svg>

</button>

</div>

</div>


<!-- =========================================================
     CONFIRM PASSWORD
========================================================= -->

<div class="input-group">

<label>Confirm Password</label>

<div class="input-box">

<svg xmlns="http://www.w3.org/2000/svg"
width="20"
height="20"
fill="none"
stroke="currentColor"
stroke-width="2"
viewBox="0 0 24 24">

<rect
x="3"
y="11"
width="18"
height="10"
rx="2"/>

<path d="M7 11V7a5 5 0 0 1 10 0v4"/>

</svg>

<input
id="confirmPassword"
type="password"
placeholder="Confirm your password"
required>

</div>

</div>


<!-- =========================================================
     CREATE ACCOUNT
========================================================= -->

<button
type="submit"
class="login-btn">

Create Account

</button>


<div class="divider">

<span>OR</span>

</div>


<!-- =========================================================
     LOGIN
========================================================= -->

<div class="signup">

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</form>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="signup.js"></script>

</body>

</html>
